  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       LINGUAKIDS LEVEL 2 — MEGA FUN CSS (Chinese Version)
    ============================================================ */

    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Quicksand', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      background-color: #fffbf0;
      background-image:
        radial-gradient(circle at 8%  12%, #ff6bb540 0%, transparent 28%),
        radial-gradient(circle at 92% 8%,  #43e97b40 0%, transparent 28%),
        radial-gradient(circle at 50% 50%, #f9ca2440 0%, transparent 40%),
        radial-gradient(circle at 15% 88%, #38f9d740 0%, transparent 28%),
        radial-gradient(circle at 88% 85%, #4facfe40 0%, transparent 28%),
        radial-gradient(circle at 70% 30%, #fa709a30 0%, transparent 22%);
    }

    /* Floating confetti dots */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle, #ff6bb5 2px, transparent 2px),
        radial-gradient(circle, #43e97b 2px, transparent 2px),
        radial-gradient(circle, #f9ca24 2px, transparent 2px),
        radial-gradient(circle, #4facfe 2px, transparent 2px),
        radial-gradient(circle, #fa709a 2px, transparent 2px),
        radial-gradient(circle, #ff6b6b 2px, transparent 2px);
      background-size: 120px 120px, 97px 97px, 143px 143px, 83px 83px, 107px 107px, 131px 131px;
      background-position: 10px 15px, 55px 70px, 30px 40px, 80px 10px, 50px 100px, 100px 55px;
      opacity: 0.45;
      animation: driftDots 18s linear infinite alternate;
    }

    @keyframes driftDots {
      from { background-position: 10px 15px, 55px 70px, 30px 40px, 80px 10px, 50px 100px, 100px 55px; }
      to   { background-position: 22px 38px, 44px 52px, 52px 62px, 62px 28px, 68px 82px, 82px 72px; }
    }

    /* ---- HEADING ---- */
    h2 {
      text-align: center;
      font-family: 'Baloo 2', cursive;
      font-size: 2rem;
      font-weight: 800;
      color: #0ea5e9;
      text-shadow: 3px 3px 0 #bae6fd, 5px 5px 0 rgba(14,165,233,0.15);
      margin: 16px 0 8px;
      position: relative;
      z-index: 1;
      animation: titleWobble 3.5s ease-in-out infinite;
    }

    @keyframes titleWobble {
      0%,100% { transform: rotate(-1deg) scale(1); }
      25%      { transform: rotate(1.5deg) scale(1.02); }
      75%      { transform: rotate(-0.5deg) scale(0.98); }
    }

    /* ---- GRID ---- */
    .item-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      margin: 20px auto;
      padding: 0 18px;
      max-width: 1200px;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    /* ---- ITEM CARDS ---- */
    .item-card {
      background: white;
      padding: 16px 10px 14px;
      border-radius: 24px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      position: relative;
      border: 3px solid transparent;
      transition: transform 0.22s cubic-bezier(.34,1.7,.64,1), box-shadow 0.2s;
      box-shadow: 0 7px 0 #c0c0c0, 0 10px 20px rgba(0,0,0,0.08);
      animation: cardPop 0.4s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes cardPop {
      from { transform: scale(0.5) rotate(-8deg); opacity: 0; }
      to   { transform: scale(1)   rotate(0deg);  opacity: 1; }
    }

    /* Rainbow card colors cycling through 6 themes */
    .item-card:nth-child(6n+1) { background:#fff0f6; border-color:#ff6bb5; box-shadow:0 7px 0 #e05a9f, 0 10px 20px rgba(255,107,181,0.15); }
    .item-card:nth-child(6n+2) { background:#f0fff4; border-color:#43e97b; box-shadow:0 7px 0 #28c25e, 0 10px 20px rgba(67,233,123,0.15);  }
    .item-card:nth-child(6n+3) { background:#fffbf0; border-color:#f9ca24; box-shadow:0 7px 0 #d4a800, 0 10px 20px rgba(249,202,36,0.15);  }
    .item-card:nth-child(6n+4) { background:#f0f8ff; border-color:#4facfe; box-shadow:0 7px 0 #2280d4, 0 10px 20px rgba(79,172,254,0.15);  }
    .item-card:nth-child(6n+5) { background:#fff0f9; border-color:#f472b6; box-shadow:0 7px 0 #be185d, 0 10px 20px rgba(244,114,182,0.15); }
    .item-card:nth-child(6n+6) { background:#fff4ee; border-color:#fb923c; box-shadow:0 7px 0 #c2620d, 0 10px 20px rgba(251,146,60,0.15);  }

    /* Stagger pop-in animation */
    .item-card:nth-child(1)  { animation-delay:.02s }
    .item-card:nth-child(2)  { animation-delay:.05s }
    .item-card:nth-child(3)  { animation-delay:.08s }
    .item-card:nth-child(4)  { animation-delay:.11s }
    .item-card:nth-child(5)  { animation-delay:.14s }
    .item-card:nth-child(6)  { animation-delay:.17s }
    .item-card:nth-child(7)  { animation-delay:.20s }
    .item-card:nth-child(8)  { animation-delay:.23s }
    .item-card:nth-child(9)  { animation-delay:.26s }
    .item-card:nth-child(10) { animation-delay:.29s }

    .item-card:hover {
      transform: translateY(-8px) rotate(-1deg) scale(1.06);
    }

    .item-card:active {
      transform: translateY(5px) scale(0.96);
      box-shadow: 0 2px 0 #aaa, 0 4px 8px rgba(0,0,0,0.1) !important;
      transition: transform 0.07s, box-shadow 0.07s;
    }

    /* Card emoji */
    .item-card > div:first-child {
      font-size: 2.4rem;
      line-height: 1.2;
    }

    /* Chinese character */
    .hanzi {
      font-size: 1.4rem;
      font-weight: 800;
      color: #333;
      font-family: 'Baloo 2', cursive;
    }

    /* Pinyin */
    .pinyin {
      font-size: 1rem;
      font-weight: 600;
      color: #4facfe;
    }

    /* English/Translation */
    .english {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fb923c;
      margin-top: 2px;
    }

    /* ---- SPEAK BUTTON ---- */
    .speak-btn {
      background: linear-gradient(160deg, #f9ca24, #f0932b);
      border: none;
      border-bottom: 4px solid #c07800;
      border-right: 2px solid #c07800;
      color: white;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      margin-top: 4px;
      box-shadow: 0 3px 10px rgba(249,202,36,0.35);
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), border-bottom 0.1s;
    }

    .speak-btn:hover  { transform: translateY(-2px) scale(1.08); }
    .speak-btn:active { transform: translateY(2px); border-bottom-width: 1px; border-right-width: 1px; }

    /* ---- BACK BUTTON ---- */
    .btn {
      background: linear-gradient(160deg, #43e97b, #38f9d7);
      border: none;
      border-bottom: 5px solid #1db863;
      border-right: 3px solid #1db863;
      color: white;
      padding: 11px 26px;
      border-radius: 999px;
      font-family: 'Baloo 2', cursive;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin: 12px 8px;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0,0,0,0.15);
      box-shadow: 0 6px 18px rgba(67,233,123,0.35);
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s, border-bottom 0.1s;
      position: relative;
      z-index: 1;
    }

    .btn:hover  { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 24px rgba(67,233,123,0.45); }
    .btn:active { transform: translateY(4px) scale(0.97); border-bottom-width: 1px; border-right-width: 1px; box-shadow: none; }

    /* Back button container */
    .back-button-container {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1000;
    }

    .back-button-container .btn {
      margin: 0;
      box-shadow: 0 5px 16px rgba(67,233,123,0.35);
    }

    /* ---- TOAST NOTIFICATION ---- */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #58cc02, #1cb0f6);
      color: white;
      padding: 15px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(88,204,2,0.3);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(100px);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
      border: 2px solid #fff;
      font-family: 'Baloo 2', cursive;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast i {
      font-size: 1.8rem;
      color: #FFD700;
    }

    #toastTitle {
      font-weight: 800;
      font-size: 1.1rem;
    }

    #toastDesc {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 900px) {
      .item-grid { grid-template-columns: repeat(3, 1fr); }
    }
    
    @media (max-width: 600px) {
      .item-grid { 
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 12px;
      }
      h2 { 
        font-size: 1.6rem;
        margin-top: 60px;
      }
      .back-button-container {
        top: 10px;
        left: 10px;
      }
      .back-button-container .btn {
        padding: 8px 16px;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 380px) {
      .item-grid { grid-template-columns: repeat(2, 1fr); }
      .hanzi { font-size: 1.2rem; }
      .pinyin { font-size: 0.9rem; }
    }
  </style>
</head>

let currentCategory = 'fruits';
let interfaceLang = 'english';

// ===== USER MANAGEMENT FUNCTIONS =====
function getUserLanguageKey() {
  const username = getCurrentUser();
  return `linguaKids_${username}_chineseInterfaceLang`;
}

function getCurrentUser() {
  const urlParams = new URLSearchParams(window.location.search);
  const urlUser = urlParams.get('user');
  if (urlUser) {
    sessionStorage.setItem('currentUser', urlUser);
    return urlUser;
  }
  
  const sessionUser = sessionStorage.getItem('currentUser');
  if (sessionUser) {
    return sessionUser;
  }
  
  return 'guest';
}

function loadInterfaceLanguage() {
  const storageKey = getUserLanguageKey();
  const savedLang = localStorage.getItem(storageKey);
  
  if (savedLang && (savedLang === 'english' || savedLang === 'marathi' || savedLang === 'hindi')) {
    interfaceLang = savedLang;
  } else {
    interfaceLang = 'english';
  }
  
  return interfaceLang;
}

function getCategory() {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get('category') || 'fruits';
}

function getCategoryTitle(category) {
  const t = translations[interfaceLang];
  return t.categoryTitles[category] || "Category";
}

function getTranslatedWord(item) {
  if (interfaceLang === 'marathi') {
    return item.marathi || item.english;
  } else if (interfaceLang === 'hindi') {
    return item.hindi || item.english;
  }
  return item.english;
}

function loadCategory(category = null){
  if (category) {
    currentCategory = category;
    const newUrl = `${window.location.pathname}?category=${category}&lang=${interfaceLang}`;
    window.history.replaceState({}, '', newUrl);
  } else {
    currentCategory = getCategory();
  }
  
  const items = DATA[currentCategory] || [];

  document.getElementById("categoryTitle").textContent = getCategoryTitle(currentCategory);

  // Update back button text
  const t = translations[interfaceLang];
  document.getElementById('backBtn').textContent = t.back;

  document.getElementById("itemGrid").innerHTML = items.map(i => `
    <div class="item-card">
      <div style="font-size:2rem;">${i.icon}</div>
      <div class="hanzi">${i.char}</div>
      <div class="pinyin">${i.pinyin}</div>
      <div class="english">${getTranslatedWord(i)}</div>
      <button class="speak-btn" onclick="speak('${i.char}', '${currentCategory}')">🔊</button>
    </div>
  `).join("");
}

function changeCategory(category) {
  loadCategory(category);
}

function speak(chineseChar, category){
  const utter = new SpeechSynthesisUtterance(chineseChar);
  utter.lang = "zh-CN";
  speechSynthesis.speak(utter);
  
  trackWordInteraction(category);
}

function trackWordInteraction(category) {
  const interactionKey = `word_interaction_${category}_${new Date().toDateString()}`;
  let interactions = parseInt(sessionStorage.getItem(interactionKey) || '0');
  
  interactions++;
  sessionStorage.setItem(interactionKey, interactions.toString());
  
  if (interactions % 2 === 0 && typeof updateProgress === 'function') {
    updateProgress('level2', category, 1);
  }
}

function goBack(){
  // Preserve language when going back
  const urlParams = new URLSearchParams(window.location.search);
  const lang = urlParams.get('lang') || interfaceLang;
  window.location.href = `chinese.html?lang=${lang}`;
}

function showAchievementToast(title, description) {
  const t = translations[interfaceLang];
  const toast = document.getElementById("achievementToast");
  if(!toast) return;
  toast.querySelector("#toastTitle").textContent = title || t.achievements.title;
  toast.querySelector("#toastDesc").textContent = description || t.achievements.desc;
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); }, 3000);
}

document.addEventListener('DOMContentLoaded', function() {
  // Load language preference first
  loadInterfaceLanguage();
  
  // Check URL for language parameter
  const urlParams = new URLSearchParams(window.location.search);
  const urlLang = urlParams.get('lang');
  if (urlLang && (urlLang === 'english' || urlLang === 'marathi' || urlLang === 'hindi')) {
    interfaceLang = urlLang;
  }
  
  loadCategory();
  
  // Update toast texts
  showAchievementToast = showAchievementToast;
});

// Make functions globally accessible
window.goBack = goBack;
window.changeCategory = changeCategory;
window.speak = speak;
window.showAchievementToast = showAchievementToast;
</script>
