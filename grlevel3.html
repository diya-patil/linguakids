<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">

  <title>LinguaKids - Level 3</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       LINGUAKIDS LEVEL 3 — MEGA FUN CSS (SAME AS ENGLEVEL3)
    ============================================================ */

    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Quicksand', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      background-color: #fffbf0;
      background-image:
        radial-gradient(circle at 8%  12%, #ff6bb540 0%, transparent 28%),
        radial-gradient(circle at 92% 8%,  #43e97b40 0%, transparent 28%),
        radial-gradient(circle at 50% 50%, #f9ca2440 0%, transparent 40%),
        radial-gradient(circle at 15% 88%, #38f9d740 0%, transparent 28%),
        radial-gradient(circle at 88% 85%, #4facfe40 0%, transparent 28%),
        radial-gradient(circle at 70% 30%, #fa709a30 0%, transparent 22%);
    }

    /* Floating confetti dots */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle, #ff6bb5 2px, transparent 2px),
        radial-gradient(circle, #43e97b 2px, transparent 2px),
        radial-gradient(circle, #f9ca24 2px, transparent 2px),
        radial-gradient(circle, #4facfe 2px, transparent 2px),
        radial-gradient(circle, #fa709a 2px, transparent 2px),
        radial-gradient(circle, #ff6b6b 2px, transparent 2px);
      background-size: 120px 120px, 97px 97px, 143px 143px, 83px 83px, 107px 107px, 131px 131px;
      background-position: 10px 15px, 55px 70px, 30px 40px, 80px 10px, 50px 100px, 100px 55px;
      opacity: 0.45;
      animation: driftDots 18s linear infinite alternate;
    }

    @keyframes driftDots {
      from { background-position: 10px 15px, 55px 70px, 30px 40px, 80px 10px, 50px 100px, 100px 55px; }
      to   { background-position: 22px 38px, 44px 52px, 52px 62px, 62px 28px, 68px 82px, 82px 72px; }
    }

    /* ---- HEADING ---- */
    h2 {
      text-align: center;
      font-family: 'Baloo 2', cursive;
      font-size: 2rem;
      font-weight: 800;
      color: #f472b6;
      text-shadow: 3px 3px 0 #fce7f3, 5px 5px 0 rgba(244,114,182,0.15);
      margin: 16px 0 8px;
      position: relative;
      z-index: 1;
      animation: titleWobble 3.5s ease-in-out infinite;
    }

    @keyframes titleWobble {
      0%,100% { transform: rotate(-1deg) scale(1); }
      25%      { transform: rotate(1.5deg) scale(1.02); }
      75%      { transform: rotate(-0.5deg) scale(0.98); }
    }

    /* ---- GRID ---- */
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin: 20px auto;
      padding: 0 18px;
      max-width: 1000px;
      position: relative;
      z-index: 1;
    }

    /* ---- ITEM CARDS ---- */
    .item-card {
      background: white;
      padding: 20px 16px 16px;
      border-radius: 24px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 3px solid transparent;
      transition: transform 0.22s cubic-bezier(.34,1.7,.64,1), box-shadow 0.2s;
      box-shadow: 0 7px 0 #c0c0c0, 0 10px 20px rgba(0,0,0,0.08);
      animation: cardPop 0.4s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes cardPop {
      from { transform: scale(0.5) rotate(-8deg); opacity: 0; }
      to   { transform: scale(1)   rotate(0deg);  opacity: 1; }
    }

    /* Rainbow card colors cycling through 6 themes */
    .item-card:nth-child(6n+1) { background:#fff0f6; border-color:#ff6bb5; box-shadow:0 7px 0 #e05a9f, 0 10px 20px rgba(255,107,181,0.15); }
    .item-card:nth-child(6n+2) { background:#f0fff4; border-color:#43e97b; box-shadow:0 7px 0 #28c25e, 0 10px 20px rgba(67,233,123,0.15);  }
    .item-card:nth-child(6n+3) { background:#fffbf0; border-color:#f9ca24; box-shadow:0 7px 0 #d4a800, 0 10px 20px rgba(249,202,36,0.15);  }
    .item-card:nth-child(6n+4) { background:#f0f8ff; border-color:#4facfe; box-shadow:0 7px 0 #2280d4, 0 10px 20px rgba(79,172,254,0.15);  }
    .item-card:nth-child(6n+5) { background:#fff0f9; border-color:#f472b6; box-shadow:0 7px 0 #be185d, 0 10px 20px rgba(244,114,182,0.15); }
    .item-card:nth-child(6n+6) { background:#fff4ee; border-color:#fb923c; box-shadow:0 7px 0 #c2620d, 0 10px 20px rgba(251,146,60,0.15);  }

    /* Stagger pop-in animation */
    .item-card:nth-child(1)  { animation-delay:.02s }
    .item-card:nth-child(2)  { animation-delay:.05s }
    .item-card:nth-child(3)  { animation-delay:.08s }
    .item-card:nth-child(4)  { animation-delay:.11s }
    .item-card:nth-child(5)  { animation-delay:.14s }
    .item-card:nth-child(6)  { animation-delay:.17s }
    .item-card:nth-child(7)  { animation-delay:.20s }
    .item-card:nth-child(8)  { animation-delay:.23s }
    .item-card:nth-child(9)  { animation-delay:.26s }
    .item-card:nth-child(10) { animation-delay:.29s }

    .item-card:hover {
      transform: translateY(-8px) rotate(-1deg) scale(1.06);
    }

    .item-card:active {
      transform: translateY(5px) scale(0.96);
      box-shadow: 0 2px 0 #aaa, 0 4px 8px rgba(0,0,0,0.1) !important;
      transition: transform 0.07s, box-shadow 0.07s;
    }

    /* ---- QUESTION & ANSWER ---- */
    .question {
      font-weight: 800;
      font-family: 'Baloo 2', cursive;
      font-size: 1.1rem;
      color: #0ea5e9;
      margin-bottom: 8px;
    }

    .answer {
      margin-bottom: 10px;
      color: #444;
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.4;
    }

    /* ---- TRANSLATION ---- */
    .translation {
      font-size: 0.88rem;
      font-weight: 800;
      color: #fb923c;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    /* ---- SPEAK BUTTONS ---- */
    .speak-btn {
      background: linear-gradient(160deg, #f9ca24, #f0932b);
      border: none;
      border-bottom: 4px solid #c07800;
      border-right: 2px solid #c07800;
      color: white;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      margin: 4px;
      min-width: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 3px 10px rgba(249,202,36,0.35);
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), border-bottom 0.1s;
    }

    .speak-btn:hover  { transform: translateY(-2px) scale(1.08); }
    .speak-btn:active { transform: translateY(2px); border-bottom-width: 1px; border-right-width: 1px; }
    .speak-btn i      { font-size: 0.9rem; }

    /* ---- BACK BUTTON ---- */
    .btn {
      background: linear-gradient(160deg, #43e97b, #38f9d7);
      border: none;
      border-bottom: 5px solid #1db863;
      border-right: 3px solid #1db863;
      color: white;
      padding: 11px 26px;
      border-radius: 999px;
      font-family: 'Baloo 2', cursive;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin: 12px 8px;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0,0,0,0.15);
      box-shadow: 0 6px 18px rgba(67,233,123,0.35);
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s, border-bottom 0.1s;
      position: relative;
      z-index: 1;
    }

    .btn:hover  { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 24px rgba(67,233,123,0.45); }
    .btn:active { transform: translateY(4px) scale(0.97); border-bottom-width: 1px; border-right-width: 1px; box-shadow: none; }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 600px) {
      .item-grid { grid-template-columns: 1fr; }
      h2 { font-size: 1.6rem; }
    }
  </style>
</head>

let interfaceLang = 'english';

// ===== USER MANAGEMENT FUNCTIONS =====
function getUserLanguageKey() {
  const username = getCurrentUser();
  return `linguaKids_${username}_germanInterfaceLang`;
}

function getCurrentUser() {
  const urlParams = new URLSearchParams(window.location.search);
  const urlUser = urlParams.get('user');
  if (urlUser) {
    sessionStorage.setItem('currentUser', urlUser);
    return urlUser;
  }
  
  const sessionUser = sessionStorage.getItem('currentUser');
  if (sessionUser) {
    return sessionUser;
  }
  
  return 'guest';
}

function getInterfaceLanguage() {
  // First check URL parameter
  const urlParams = new URLSearchParams(window.location.search);
  const urlLang = urlParams.get('lang');
  if (urlLang && (urlLang === 'hindi' || urlLang === 'marathi')) {
    return urlLang;
  }
  
  // Then check from german.html's saved preference
  const storageKey = getUserLanguageKey();
  const savedLang = localStorage.getItem(storageKey);
  if (savedLang === 'hindi' || savedLang === 'marathi') {
    return savedLang;
  }
  
  // Default to English
  return 'english';
}

function loadInterfaceLanguage() {
  interfaceLang = getInterfaceLanguage();
  return interfaceLang;
}

function getCategory(){
  const params = new URLSearchParams(window.location.search);
  return params.get("category");
}

function getCategoryTitle(category) {
  const t = translations[interfaceLang] || translations.english;
  if (category && t[category]) {
    return t[category];
  }
  return category ? "Kategorie: " + category.charAt(0).toUpperCase() + category.slice(1) : "Kategorie";
}

function getTranslatedGreetingQuestion(item) {
  if (interfaceLang === 'marathi') return item.marathi_q || item.q_en;
  if (interfaceLang === 'hindi') return item.hindi_q || item.q_en;
  return item.q_en;
}

function getTranslatedGreetingAnswer(item) {
  if (interfaceLang === 'marathi') return item.marathi_a || item.a_en;
  if (interfaceLang === 'hindi') return item.hindi_a || item.a_en;
  return item.a_en;
}

function getTranslatedActivity(item) {
  if (interfaceLang === 'marathi') return item.marathi || item.q_en;
  if (interfaceLang === 'hindi') return item.hindi || item.q_en;
  return item.q_en;
}

function getTranslatedQuestionAnswer(item, type) {
  if (!item) return '';
  
  if (type === 'q') {
    if (interfaceLang === 'marathi') return item.marathi_q || item.q_en;
    if (interfaceLang === 'hindi') return item.hindi_q || item.q_en;
    return item.q_en;
  } else if (type === 'a') {
    if (interfaceLang === 'marathi') return item.marathi_a || item.a_en;
    if (interfaceLang === 'hindi') return item.hindi_a || item.a_en;
    return item.a_en;
  }
  
  return '';
}

function loadCategory(){
  const cat = getCategory();
  const items = DATA[cat] || [];
  
  // Update interface language
  interfaceLang = getInterfaceLanguage();
  const t = translations[interfaceLang] || translations.english;

  if (typeof updateProgress === 'function') {
    updateProgress('level3', cat, 0.1); 
  }

  // Update back button text
  document.getElementById("backBtn").textContent = t.back;
  
  document.getElementById("categoryTitle").textContent = getCategoryTitle(cat);
  
  let html = '';
  
  if (cat === 'greetings') {
    html = items.map((i, index) => `
      <div class="item-card">
        <div class="question">${i.q}</div>
        <div class="translation">${getTranslatedGreetingQuestion(i)}</div>
        <div class="answer">${i.a}</div>
        <div class="translation">${getTranslatedGreetingAnswer(i)}</div>
        <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
          <button class="speak-btn" onclick="handleSpeak('${cat}', ${index}, 'question', event)">
            <i class="fas fa-volume-up"></i> Q
          </button>
          <button class="speak-btn" onclick="handleSpeak('${cat}', ${index}, 'answer', event)">
            <i class="fas fa-volume-up"></i> A
          </button>
        </div>
      </div>
    `).join("");
  } else if (cat === 'questions') {
    html = items.map((i, index) => `
      <div class="item-card">
        <div class="question">${i.q}</div>
        <div class="translation">${getTranslatedQuestionAnswer(i, 'q')}</div>
        <div class="answer">${i.a}</div>
        <div class="translation">${getTranslatedQuestionAnswer(i, 'a')}</div>
        <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
          <button class="speak-btn" onclick="handleSpeak('${cat}', ${index}, 'question', event)">
            <i class="fas fa-volume-up"></i> Q
          </button>
          <button class="speak-btn" onclick="handleSpeak('${cat}', ${index}, 'answer', event)">
            <i class="fas fa-volume-up"></i> A
          </button>
        </div>
      </div>
    `).join("");
  } else {
    html = items.map((i, index) => `
      <div class="item-card">
        <div class="question">${i.q}</div>
        <div class="translation">${getTranslatedActivity(i)}</div>
        <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
          <button class="speak-btn" onclick="handleSpeak('${cat}', ${index}, 'question', event)">
            <i class="fas fa-volume-up"></i> Q
          </button>
        </div>
      </div>
    `).join("");
  }
  
  document.getElementById("content").innerHTML = html;
}

function handleSpeak(category, index, type, event) {
  if (event) event.stopPropagation();
  
  const item = DATA[category][index];
  let textToSpeak = '';
  
  if (type === 'question') {
    textToSpeak = item.q;
  } else if (type === 'answer') {
    textToSpeak = item.a;
  }

  if (textToSpeak) {
    speak(textToSpeak);
    if (typeof updateLevel3SentenceProgress === 'function') {
      updateLevel3SentenceProgress(category, index);
    }
  }
}

function speak(text){
  const cleanText = text.replace(/[^\w\säöüßÄÖÜ]/gi, ' ').trim();
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = "de-DE";
    utterance.rate = 0.8;
    utterance.pitch = 1.2;
    speechSynthesis.speak(utterance);
  } else {
    console.log("Speech synthesis not supported");
  }
}

function goBack(){
  // Preserve language when going back
  const lang = getInterfaceLanguage();
  window.location.href = `german.html?lang=${lang}`;
}

function handleVisibilityChange() {
  if (!document.hidden) loadCategory();
}

document.addEventListener('DOMContentLoaded', function() {
  console.log("German Level 3 page loaded");
  document.addEventListener('visibilitychange', handleVisibilityChange);
  window.addEventListener('pageshow', function(event) {
    if (event.persisted) loadCategory();
  });
  if (typeof initProgress === 'function') initProgress();
  loadInterfaceLanguage();
  loadCategory();
});

window.addEventListener('load', loadCategory);
