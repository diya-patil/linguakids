    body, html {
      margin: 0; padding: 0;
      font-family: 'Nunito', 'Quicksand', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      background-color: #fffbf0;
      background-image:
        radial-gradient(circle at 8%  12%, #ff6bb540 0%, transparent 28%),
        radial-gradient(circle at 92% 8%,  #43e97b40 0%, transparent 28%),
        radial-gradient(circle at 50% 50%, #f9ca2440 0%, transparent 40%),
        radial-gradient(circle at 15% 88%, #38f9d740 0%, transparent 28%),
        radial-gradient(circle at 88% 85%, #4facfe40 0%, transparent 28%),
        radial-gradient(circle at 70% 30%, #fa709a30 0%, transparent 22%);
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(circle, #ff6bb5 2px, transparent 2px),
        radial-gradient(circle, #43e97b 2px, transparent 2px),
        radial-gradient(circle, #f9ca24 2px, transparent 2px),
        radial-gradient(circle, #4facfe 2px, transparent 2px),
        radial-gradient(circle, #fa709a 2px, transparent 2px),
        radial-gradient(circle, #ff6b6b 2px, transparent 2px);
      background-size: 120px 120px, 97px 97px, 143px 143px, 83px 83px, 107px 107px, 131px 131px;
      background-position: 10px 15px, 55px 70px, 30px 40px, 80px 10px, 50px 100px, 100px 55px;
      opacity: 0.45;
      animation: driftDots 18s linear infinite alternate;
    }
    @keyframes driftDots {
      from { background-position: 10px 15px, 55px 70px, 30px 40px, 80px 10px, 50px 100px, 100px 55px; }
      to   { background-position: 22px 38px, 44px 52px, 52px 62px, 62px 28px, 68px 82px, 82px 72px; }
    }
    @keyframes titleWobble {
      0%,100% { transform: rotate(-1deg) scale(1); }
      25%      { transform: rotate(1.5deg) scale(1.02); }
      75%      { transform: rotate(-0.5deg) scale(0.98); }
    }
    @keyframes cardPop {
      from { transform: scale(0.5) rotate(-8deg); opacity: 0; }
      to   { transform: scale(1)   rotate(0deg);  opacity: 1; }
    }
    .btn {
      background: linear-gradient(160deg, #43e97b, #38f9d7);
      border: none;
      border-bottom: 5px solid #1db863;
      border-right: 3px solid #1db863;
      color: white;
      padding: 11px 26px;
      border-radius: 999px;
      font-family: 'Baloo 2', cursive;
      font-size: 1.05rem; font-weight: 700;
      cursor: pointer; margin: 8px 5px;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0,0,0,0.15);
      box-shadow: 0 6px 18px rgba(67,233,123,0.35);
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s, border-bottom 0.1s;
    }
    .btn:hover  { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 24px rgba(67,233,123,0.45); }
    .btn:active { transform: translateY(4px) scale(0.97); border-bottom-width: 1px; border-right-width: 1px; box-shadow: none; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      color: white; padding: 14px 20px; border-radius: 20px;
      border-bottom: 4px solid #1db863;
      box-shadow: 0 6px 20px rgba(67,233,123,0.4);
      z-index: 2000; display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-family: 'Baloo 2', cursive;
      transform: translateY(120px); opacity: 0;
      transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.4s ease-out;
      max-width: 350px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast i { font-size: 1.2rem; }
    .progress-bar {
      width: 100%; height: 14px; background: #f0f0f0;
      border-radius: 999px; margin: 10px 0; overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.08);
    }
    .progress-fill {
      height: 100%; background: linear-gradient(to right, #43e97b, #38f9d7);
      width: 0%; border-radius: 999px;
      transition: width 0.8s cubic-bezier(.34,1.2,.64,1);
      box-shadow: 0 2px 8px rgba(67,233,123,0.4);
      text-align: center; color: white; font-weight: 800;
      font-size: 0.85rem; line-height: 14px;
    }
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(14,165,233,0.15);
      backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 2000;
    }
    @keyframes modalBounceIn {
      0%   { transform: scale(0.4) rotate(-8deg); opacity: 0; }
      70%  { transform: scale(1.06) rotate(2deg); opacity: 1; }
      100% { transform: scale(1)    rotate(0deg); opacity: 1; }
    }

    .achievement-card {

    .achievement-card:not(.locked) {

    .btn-secondary { background: linear-gradient(160deg, #94a3b8, #64748b); border-bottom-color: #475569; border-right-color: #475569; }

  </style>
</head>

// ===== USER MANAGEMENT FUNCTIONS =====
function getUserLanguageKey() {
  const username = getCurrentUser();
  return `linguaKids_${username}_chineseInterfaceLang`;
}

function getCurrentUser() {
  const urlParams = new URLSearchParams(window.location.search);
  const urlUser = urlParams.get('user');
  if (urlUser) {
    sessionStorage.setItem('currentUser', urlUser);
    return urlUser;
  }
  
  const sessionUser = sessionStorage.getItem('currentUser');
  if (sessionUser) {
    return sessionUser;
  }
  
  return 'guest';
}

let interfaceLang = 'english';

function loadInterfaceLanguage() {
  const storageKey = getUserLanguageKey();
  const savedLang = localStorage.getItem(storageKey);
  
  if (savedLang && (savedLang === 'english' || savedLang === 'marathi' || savedLang === 'hindi')) {
    interfaceLang = savedLang;
  } else {
    interfaceLang = 'english';
  }
  
  // Check URL for language parameter
  const urlParams = new URLSearchParams(window.location.search);
  const urlLang = urlParams.get('lang');
  if (urlLang && (urlLang === 'english' || urlLang === 'marathi' || urlLang === 'hindi')) {
    interfaceLang = urlLang;
  }
  
  // Update UI text
  updateUIText();
  
  return interfaceLang;
}

function updateUIText() {
  const t = translations[interfaceLang];
  
  // Update back button
  document.getElementById('globalBack').textContent = t.back;
  
  // Update page title
  document.getElementById('pageTitle').textContent = t.pageTitle;
  
  // Update streak label
  document.getElementById('dayStreakLabel').textContent = t.dayStreak;
  
  // Update section titles
  document.getElementById('levelProgressTitle').textContent = t.levelProgress;
  document.getElementById('achievementsTitle').textContent = t.achievements;
  
  // Update level labels
  document.getElementById('level1Label').textContent = t.level1;
  document.getElementById('level2Label').textContent = t.level2;
  document.getElementById('level3Label').textContent = t.level3;
  
  // Update buttons
  document.getElementById('continueBtn').textContent = t.continueLearning;
  document.getElementById('resetBtn').textContent = t.resetProgress;
  
  // Update modal
  document.getElementById('modalMessage').textContent = t.resetConfirm;
  document.getElementById('yesBtn').textContent = t.yes;
  document.getElementById('noBtn').textContent = t.no;
}

function goBack() {
  window.location.href = `chinese.html?lang=${interfaceLang}`;
}

const CHINESE_PROGRESS_KEY = 'linguaKidsChineseProgress';

function initChineseProgress() {
  const defaultProgress = {
    level1: { 
      initials: { completed: 0, total: 23 }, // 23 initials
      finals: { completed: 0, total: 35 },   // 35 finals
      numbers: { completed: 0, total: 100 }   // 100 numbers
    },
    level2: {
      fruits: { completed: 0, total: 15 },
      vegetables: { completed: 0, total: 15 },
      animals: { completed: 0, total: 20 },
      birds: { completed: 0, total: 14 },
      vehicles: { completed: 0, total: 19 },
      colours: { completed: 0, total: 10 }
    },
    level3: {
      greetings: { completed: 0, total: 19 },
      activities: { completed: 0, total: 20 },
      questions: { completed: 0, total: 15 }
    },
    achievements: { 
      firstSteps: false, 
      initialMaster: false, 
      finalMaster: false, 
      numberWhiz: false, 
      wordExpert: false, 
      sentenceBuilder: false, 
      weekStreak: false, 
      monthStreak: false 
    },
    streak: { count: 0, lastDate: null },
    sessionDate: null
  };

  let progress;
  try {
    progress = JSON.parse(localStorage.getItem(CHINESE_PROGRESS_KEY));
    if (!progress) {
      progress = defaultProgress;
      localStorage.setItem(CHINESE_PROGRESS_KEY, JSON.stringify(progress));
    } else {
      // Migrate old data structure if needed
      progress = migrateProgressData(progress);
    }
  } catch (e) {
    progress = defaultProgress;
    localStorage.setItem(CHINESE_PROGRESS_KEY, JSON.stringify(progress));
  }
  
  // Check achievements on initialization
  updateAchievements(progress);
  return progress;
}

function migrateProgressData(progress) {
  let modified = false;
  
  // Ensure level1 structure
  if (!progress.level1) {
    progress.level1 = {
      initials: { completed: 0, total: 23 },
      finals: { completed: 0, total: 35 },
      numbers: { completed: 0, total: 100 }
    };
    modified = true;
  } else {
    if (!progress.level1.initials) {
      progress.level1.initials = { completed: 0, total: 23 };
      modified = true;
    }
    if (!progress.level1.finals) {
      progress.level1.finals = { completed: 0, total: 35 };
      modified = true;
    }
    if (!progress.level1.numbers) {
      progress.level1.numbers = { completed: 0, total: 100 };
      modified = true;
    }
  }
  
  // Ensure level2 structure with correct totals
  if (!progress.level2) {
    progress.level2 = {
      fruits: { completed: 0, total: 15 },
      vegetables: { completed: 0, total: 15 },
      animals: { completed: 0, total: 20 },
      birds: { completed: 0, total: 14 },
      vehicles: { completed: 0, total: 19 },
      colours: { completed: 0, total: 10 }
    };
    modified = true;
  } else {
    // Update totals if they're incorrect
    const correctTotals = {
      fruits: 15,
      vegetables: 15,
      animals: 20,
      birds: 14,
      vehicles: 19,
      colours: 10
    };
    
    Object.keys(correctTotals).forEach(cat => {
      if (!progress.level2[cat]) {
        progress.level2[cat] = { completed: 0, total: correctTotals[cat] };
        modified = true;
      } else if (progress.level2[cat].total !== correctTotals[cat]) {
        progress.level2[cat].total = correctTotals[cat];
        if (progress.level2[cat].completed > correctTotals[cat]) {
          progress.level2[cat].completed = correctTotals[cat];
        }
        modified = true;
      }
    });
  }
  
  // Ensure level3 structure with correct totals
  if (!progress.level3) {
    progress.level3 = {
      greetings: { completed: 0, total: 19 },
      activities: { completed: 0, total: 20 },
      questions: { completed: 0, total: 15 }
    };
    modified = true;
  } else {
    const correctLevel3Totals = {
      greetings: 19,
      activities: 20,
      questions: 15
    };
    
    Object.keys(correctLevel3Totals).forEach(cat => {
      if (!progress.level3[cat]) {
        progress.level3[cat] = { completed: 0, total: correctLevel3Totals[cat] };
        modified = true;
      } else if (progress.level3[cat].total !== correctLevel3Totals[cat]) {
        progress.level3[cat].total = correctLevel3Totals[cat];
        if (progress.level3[cat].completed > correctLevel3Totals[cat]) {
          progress.level3[cat].completed = correctLevel3Totals[cat];
        }
        modified = true;
      }
    });
  }
  
  // Ensure achievements structure
  if (!progress.achievements) {
    progress.achievements = {
      firstSteps: false,
      initialMaster: false,
      finalMaster: false,
      numberWhiz: false,
      wordExpert: false,
      sentenceBuilder: false,
      weekStreak: false,
      monthStreak: false
    };
    modified = true;
  }
  
  // Ensure streak structure
  if (!progress.streak) {
    progress.streak = { count: 0, lastDate: null };
    modified = true;
  }
  
  if (modified) {
    localStorage.setItem(CHINESE_PROGRESS_KEY, JSON.stringify(progress));
  }
  
  return progress;
}

function updateAchievements(progress) {
  if (!progress) return;
  
  let earnedAchievement = false;
  
  // First Steps: Complete any activity
  const anyCompleted = 
    (progress.level1.initials?.completed || 0) > 0 ||
    (progress.level1.finals?.completed || 0) > 0 ||
    (progress.level1.numbers?.completed || 0) > 0 ||
    Object.values(progress.level2 || {}).some(cat => cat.completed > 0) ||
    Object.values(progress.level3 || {}).some(cat => cat.completed > 0);
  
  if (!progress.achievements.firstSteps && anyCompleted) {
    progress.achievements.firstSteps = true;
    earnedAchievement = true;
    showAchievementToast("First Steps!", "You've completed your first Chinese activity!");
  }
  
  // Initials Master: Learn all initials
  if (!progress.achievements.initialMaster && 
      progress.level1.initials?.completed >= progress.level1.initials?.total) {
    progress.achievements.initialMaster = true;
    earnedAchievement = true;
    showAchievementToast("Initials Master!", "You've learned all Chinese initials!");
  }
  
  // Finals Master: Learn all finals
  if (!progress.achievements.finalMaster && 
      progress.level1.finals?.completed >= progress.level1.finals?.total) {
    progress.achievements.finalMaster = true;
    earnedAchievement = true;
    showAchievementToast("Finals Master!", "You've learned all Chinese finals!");
  }
  
  // Number Whiz: Learn 50 numbers
  if (!progress.achievements.numberWhiz && 
      (progress.level1.numbers?.completed || 0) >= 50) {
    progress.achievements.numberWhiz = true;
    earnedAchievement = true;
    showAchievementToast("Number Whiz!", "You know your Chinese numbers well!");
  }
  
  // Word Expert: Master 3 word categories (80% completion in each)
  if (!progress.achievements.wordExpert) {
    const wordCategories = Object.keys(progress.level2 || {});
    const masteredCategories = wordCategories.filter(cat => 
      progress.level2[cat]?.completed / progress.level2[cat]?.total >= 0.8
    ).length;
    
    if (masteredCategories >= 3) {
      progress.achievements.wordExpert = true;
      earnedAchievement = true;
      showAchievementToast("Word Expert!", "You've mastered 3 Chinese word categories!");
    }
  }
  
  // Sentence Builder: Complete Level 3 (all categories at 80%)
  if (!progress.achievements.sentenceBuilder) {
    const level3Categories = Object.keys(progress.level3 || {});
    const masteredLevel3 = level3Categories.filter(cat => 
      progress.level3[cat]?.completed / progress.level3[cat]?.total >= 0.8
    ).length;
    
    if (masteredLevel3 >= 2) {
      progress.achievements.sentenceBuilder = true;
      earnedAchievement = true;
      showAchievementToast("Sentence Builder!", "You can form simple Chinese sentences!");
    }
  }
  
  // Streak achievements
  if (!progress.achievements.weekStreak && (progress.streak?.count || 0) >= 7) {
    progress.achievements.weekStreak = true;
    earnedAchievement = true;
    showAchievementToast("7-Day Streak!", "You've practiced Chinese for 7 days in a row!");
  }
  
  if (!progress.achievements.monthStreak && (progress.streak?.count || 0) >= 30) {
    progress.achievements.monthStreak = true;
    earnedAchievement = true;
    showAchievementToast("30-Day Streak!", "You're a dedicated Chinese learner!");
  }
  
  if (earnedAchievement) {
    localStorage.setItem(CHINESE_PROGRESS_KEY, JSON.stringify(progress));
  }
}

function displayProgress() {
  const progress = JSON.parse(localStorage.getItem(CHINESE_PROGRESS_KEY));
  
  if (!progress) {
    initChineseProgress();
    displayProgress(); // Recursive call after initialization
    return;
  }
  
  // Level 1 Progress - Average of initials, finals, and numbers
  const initialsProgress = progress.level1.initials.completed / progress.level1.initials.total;
  const finalsProgress = progress.level1.finals.completed / progress.level1.finals.total;
  const numbersProgress = progress.level1.numbers.completed / progress.level1.numbers.total;
  const level1TotalProgress = (initialsProgress + finalsProgress + numbersProgress) / 3 * 100;
  document.getElementById('level1Progress').style.width = Math.min(level1TotalProgress, 100) + '%';
  document.getElementById('level1Progress').textContent = Math.round(Math.min(level1TotalProgress, 100)) + '%';
  
  // Level 2 Progress - Average of all categories
  const level2Categories = Object.keys(progress.level2);
  const level2ProgressSum = level2Categories.reduce((sum, cat) =>
    sum + (progress.level2[cat].completed / progress.level2[cat].total)
  , 0);
  const level2TotalProgress = (level2ProgressSum / level2Categories.length) * 100;
  document.getElementById('level2Progress').style.width = Math.min(level2TotalProgress, 100) + '%';
  document.getElementById('level2Progress').textContent = Math.round(Math.min(level2TotalProgress, 100)) + '%';
  
  // Level 3 Progress - Average of all categories
  const level3Categories = Object.keys(progress.level3);
  const level3ProgressSum = level3Categories.reduce((sum, cat) =>
    sum + (progress.level3[cat].completed / progress.level3[cat].total)
  , 0);
  const level3TotalProgress = (level3ProgressSum / level3Categories.length) * 100;
  document.getElementById('level3Progress').style.width = Math.min(level3TotalProgress, 100) + '%';
  document.getElementById('level3Progress').textContent = Math.round(Math.min(level3TotalProgress, 100)) + '%';
  
  document.getElementById('streakCount').textContent = progress.streak.count;
  
  displayAchievements(progress.achievements);
}

function displayAchievements(achievements) {
  const t = translations[interfaceLang];
  
  const achievementsData = [
    { id: 'firstSteps', icon: 'fa-baby', title: t.firstSteps, desc: t.firstStepsDesc, color: '#FF6B6B' },
    { id: 'initialMaster', icon: 'fa-font', title: t.initialMaster, desc: t.initialMasterDesc, color: '#4ECDC4' },
    { id: 'finalMaster', icon: 'fa-language', title: t.finalMaster, desc: t.finalMasterDesc, color: '#FFD166' },
    { id: 'numberWhiz', icon: 'fa-calculator', title: t.numberWhiz, desc: t.numberWhizDesc, color: '#06D6A0' },
    { id: 'wordExpert', icon: 'fa-book', title: t.wordExpert, desc: t.wordExpertDesc, color: '#118AB2' },
    { id: 'sentenceBuilder', icon: 'fa-comment', title: t.sentenceBuilder, desc: t.sentenceBuilderDesc, color: '#EF476F' },
    { id: 'weekStreak', icon: 'fa-fire', title: t.weekStreak, desc: t.weekStreakDesc, color: '#FF5400' },
    { id: 'monthStreak', icon: 'fa-fire', title: t.monthStreak, desc: t.monthStreakDesc, color: '#FF0000' }
  ];
  
  const container = document.getElementById('achievementsContainer');
  container.innerHTML = achievementsData.map(ach => `
    <div class="achievement-card ${achievements[ach.id] ? '' : 'locked'}">
      <div class="achievement-icon" style="color: ${ach.color}">
        <i class="fas ${ach.icon}"></i>
      </div>
      <div class="achievement-title">${ach.title}</div>
      <div class="achievement-desc">${ach.desc}</div>
    </div>
  `).join('');
}

function loadChineseHome() {
  window.location.href = `chinese.html?lang=${interfaceLang}`;
}

function resetProgress() {
  document.getElementById('customResetModal').style.display = 'flex';
}

function performReset() {
  localStorage.removeItem(CHINESE_PROGRESS_KEY);
  sessionStorage.clear();
  
  document.getElementById('customResetModal').style.display = 'none';

  initChineseProgress();
  displayProgress();
  
  const t = translations[interfaceLang];
  showAchievementToast(t.progressReset, t.dataCleared);
}

// Function to show achievement toast
function showAchievementToast(title, description) {
  const toast = document.getElementById('achievementToast');
  if (!toast) return;
  
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastDesc').textContent = description;
  
  toast.classList.add('show');
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

// Add an interval to check for achievements periodically (for when returning to this page)
function startAchievementChecker() {
  // Check every 5 seconds for new achievements
  setInterval(() => {
    const progress = JSON.parse(localStorage.getItem(CHINESE_PROGRESS_KEY));
    if (progress) {
      updateAchievements(progress);
      displayAchievements(progress.achievements);
    }
  }, 5000);
}

document.addEventListener('DOMContentLoaded', function() {
  loadInterfaceLanguage();
  
  // Initialize progress and display
  initChineseProgress();
  displayProgress();
  
  // Update toast with translated default text
  const t = translations[interfaceLang];
  document.getElementById('toastTitle').textContent = t.achievementUnlocked;
  document.getElementById('toastDesc').textContent = t.earnedBadge;
  
  // Start checking for achievements
  startAchievementChecker();
});

// Make functions globally accessible
window.goBack = goBack;
window.loadChineseHome = loadChineseHome;
window.resetProgress = resetProgress;
window.performReset = performReset;
window.showAchievementToast = showAchievementToast;
window.initChineseProgress = initChineseProgress;
window.displayProgress = displayProgress;
</script>
