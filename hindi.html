<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaKids - Hindi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       LINGUAKIDS — MEGA FUN CSS OVERHAUL 🎉 (Same as english.html)
    ============================================================ */

    body {
      font-family: 'Nunito', 'Quicksand', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #fffbf0;
      background-image:
        radial-gradient(circle at 8%  12%, #ff6bb540 0%, transparent 28%),
        radial-gradient(circle at 92% 8%,  #43e97b40 0%, transparent 28%),
        radial-gradient(circle at 50% 50%, #f9ca2440 0%, transparent 40%),
        radial-gradient(circle at 15% 88%, #38f9d740 0%, transparent 28%),
        radial-gradient(circle at 88% 85%, #4facfe40 0%, transparent 28%),
        radial-gradient(circle at 70% 30%, #fa709a30 0%, transparent 22%);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle, #ff6bb5 2px, transparent 2px),
        radial-gradient(circle, #43e97b 2px, transparent 2px),
        radial-gradient(circle, #f9ca24 2px, transparent 2px),
        radial-gradient(circle, #4facfe 2px, transparent 2px),
        radial-gradient(circle, #fa709a 2px, transparent 2px),
        radial-gradient(circle, #ff6b6b 2px, transparent 2px);
      background-size: 120px 120px, 97px 97px, 143px 143px, 83px 83px, 107px 107px, 131px 131px;
      background-position: 10px 15px, 55px 70px, 30px 40px, 80px 10px, 50px 100px, 100px 55px;
      opacity: 0.45;
      animation: driftDots 18s linear infinite alternate;
    }

    @keyframes driftDots {
      from { background-position: 10px 15px, 55px 70px, 30px 40px, 80px 10px, 50px 100px, 100px 55px; }
      to   { background-position: 22px 38px, 44px 52px, 52px 62px, 62px 28px, 68px 82px, 82px 72px; }
    }

    #app {
      max-width: 1020px;
      margin: auto;
      padding: 15px 18px;
      padding-top: 80px;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      font-family: 'Baloo 2', cursive;
      font-size: 3rem;
      font-weight: 800;
      margin: 0 0 6px;
      line-height: 1.4; /* Increased from 1 to 1.4 to give more vertical space */
      background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 35%, #6bcb77 65%, #4d96ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(3px 4px 0px rgba(0,0,0,0.12));
      animation: titleWobble 3.5s ease-in-out infinite;
      padding: 5px 0; /* Add a little padding for extra space */
    }

    @keyframes titleWobble {
      0%,100% { transform: rotate(-1deg) scale(1); }
      25%      { transform: rotate(1.5deg) scale(1.02); }
      75%      { transform: rotate(-0.5deg) scale(0.98); }
    }

    h2 {
      text-align: center;
      font-family: 'Baloo 2', cursive;
      font-size: 1.9rem;
      font-weight: 800;
      color: #0ea5e9;
      text-shadow: 3px 3px 0 #bae6fd, 5px 5px 0 rgba(14,165,233,0.15);
      margin: 10px 0 5px;
    }

    .sub-container, .letters-grid, .numbers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .sub-card, .letter-card, .number-card {
      background: white;
      padding: 18px 10px 14px;
      border-radius: 24px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      border: 3px solid transparent;
      transition: transform 0.22s cubic-bezier(.34,1.7,.64,1), box-shadow 0.2s;
      box-shadow: 0 7px 0 #c0c0c0, 0 10px 20px rgba(0,0,0,0.08);
      animation: cardPop 0.4s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes cardPop {
      from { transform: scale(0.5) rotate(-8deg); opacity: 0; }
      to   { transform: scale(1)   rotate(0deg);  opacity: 1; }
    }

    .letter-card:nth-child(6n+1) { background:#fff0f6; border-color:#ff6bb5; box-shadow:0 7px 0 #e05a9f,  0 10px 20px rgba(255,107,181,0.15); }
    .letter-card:nth-child(6n+2) { background:#f0fff4; border-color:#43e97b; box-shadow:0 7px 0 #28c25e,  0 10px 20px rgba(67,233,123,0.15);  }
    .letter-card:nth-child(6n+3) { background:#fffbf0; border-color:#f9ca24; box-shadow:0 7px 0 #d4a800,  0 10px 20px rgba(249,202,36,0.15);  }
    .letter-card:nth-child(6n+4) { background:#f0f8ff; border-color:#4facfe; box-shadow:0 7px 0 #2280d4,  0 10px 20px rgba(79,172,254,0.15);  }
    .letter-card:nth-child(6n+5) { background:#fff0f9; border-color:#f472b6; box-shadow:0 7px 0 #be185d,  0 10px 20px rgba(244,114,182,0.15); }
    .letter-card:nth-child(6n+6) { background:#fff4ee; border-color:#fb923c; box-shadow:0 7px 0 #c2620d,  0 10px 20px rgba(251,146,60,0.15);  }

    .number-card:nth-child(4n+1) { background:#f0fff4; border-color:#43e97b; box-shadow:0 7px 0 #28c25e, 0 10px 20px rgba(67,233,123,0.15);  }
    .number-card:nth-child(4n+2) { background:#f0f8ff; border-color:#4facfe; box-shadow:0 7px 0 #2280d4, 0 10px 20px rgba(79,172,254,0.15);  }
    .number-card:nth-child(4n+3) { background:#fff0f6; border-color:#ff6bb5; box-shadow:0 7px 0 #e05a9f, 0 10px 20px rgba(255,107,181,0.15); }
    .number-card:nth-child(4n+4) { background:#fffbf0; border-color:#f9ca24; box-shadow:0 7px 0 #d4a800, 0 10px 20px rgba(249,202,36,0.15);  }

    .sub-card { background:#f0f9ff; border-color:#0ea5e9; box-shadow:0 7px 0 #0369a1, 0 10px 20px rgba(14,165,233,0.15); }

    /* ---- PER-SECTION CARD COLOURS ---- */
    /* My Progress — golden yellow */
    .sub-card.card-progress {
      background: #fffbeb; border-color: #f9ca24;
      box-shadow: 0 7px 0 #d4a800, 0 10px 20px rgba(249,202,36,0.2);
    }
    .sub-card.card-progress h3 { color: #b45309; }

    /* Level 1 — fresh green */
    .sub-card.card-level1 {
      background: #f0fff4; border-color: #43e97b;
      box-shadow: 0 7px 0 #1db863, 0 10px 20px rgba(67,233,123,0.2);
    }
    .sub-card.card-level1 h3 { color: #166534; }

    /* Level 2 — sky blue */
    .sub-card.card-level2 {
      background: #f0f9ff; border-color: #38bdf8;
      box-shadow: 0 7px 0 #0369a1, 0 10px 20px rgba(56,189,248,0.2);
    }
    .sub-card.card-level2 h3 { color: #075985; }

    /* Level 3 — hot pink */
    .sub-card.card-level3 {
      background: #fff0f8; border-color: #f472b6;
      box-shadow: 0 7px 0 #be185d, 0 10px 20px rgba(244,114,182,0.2);
    }
    .sub-card.card-level3 h3 { color: #9d174d; }

    /* Games — orange */
    .sub-card.card-games {
      background: #fff7ed; border-color: #fb923c;
      box-shadow: 0 7px 0 #c2620d, 0 10px 20px rgba(251,146,60,0.2);
    }
    .sub-card.card-games h3 { color: #9a3412; }

    .letter-card:nth-child(1),.number-card:nth-child(1)  { animation-delay:.02s }
    .letter-card:nth-child(2),.number-card:nth-child(2)  { animation-delay:.05s }
    .letter-card:nth-child(3),.number-card:nth-child(3)  { animation-delay:.08s }
    .letter-card:nth-child(4),.number-card:nth-child(4)  { animation-delay:.11s }
    .letter-card:nth-child(5),.number-card:nth-child(5)  { animation-delay:.14s }
    .letter-card:nth-child(6),.number-card:nth-child(6)  { animation-delay:.17s }
    .letter-card:nth-child(7)  { animation-delay:.20s }
    .letter-card:nth-child(8)  { animation-delay:.23s }
    .letter-card:nth-child(9)  { animation-delay:.26s }
    .letter-card:nth-child(10) { animation-delay:.29s }

    .sub-card:hover, .letter-card:hover, .number-card:hover {
      transform: translateY(-8px) rotate(-1deg) scale(1.06);
    }

    .sub-card:active, .letter-card:active, .number-card:active {
      transform: translateY(5px) scale(0.96);
      box-shadow: 0 2px 0 #aaa, 0 4px 8px rgba(0,0,0,0.1) !important;
      transition: transform 0.07s, box-shadow 0.07s;
    }

    .main-char {
      font-size: 2.4rem;
      font-weight: 900;
      font-family: 'Baloo 2', cursive;
      background: linear-gradient(135deg, #ff6b6b, #ffd93d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.1));
    }

    .small-char { font-size:1.3rem; font-weight:800; color:#4facfe; }
    .example    { margin-top:6px; font-size:1rem; font-weight:700; color:#333; }
    .translation{ font-size:0.88rem; font-weight:800; color:#fb923c; margin-top:3px; }
    .spelling   { margin-top:3px; font-size:0.8rem; color:#999; font-style:italic; }

    .btn {
      background: linear-gradient(160deg, #43e97b, #38f9d7);
      border: none;
      border-bottom: 5px solid #1db863;
      border-right: 3px solid #1db863;
      color: white;
      padding: 11px 26px;
      border-radius: 999px;
      font-family: 'Baloo 2', cursive;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin: 8px 5px;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0,0,0,0.18);
      box-shadow: 0 6px 18px rgba(67,233,123,0.35);
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s, border-bottom 0.1s;
    }

    .btn:hover  { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 24px rgba(67,233,123,0.45); }
    .btn:active { transform: translateY(4px) scale(0.97); border-bottom-width:1px; border-right-width:1px; box-shadow:none; }

    .lesson-controls { display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap; }

    canvas {
      border: 5px dashed #43e97b;
      border-radius: 24px;
      background: linear-gradient(135deg, #f0fff4 0%, #f0f8ff 100%);
      display: block;
      margin: 15px auto;
      touch-action: none;
      box-shadow: 0 8px 30px rgba(67,233,123,0.2), inset 0 2px 8px rgba(67,233,123,0.08);
    }

    .lesson-container {
      display:flex; flex-direction:column; align-items:center; text-align:center; margin-top:20px;
      background: rgba(255,255,255,0.88);
      border-radius: 32px; padding: 24px 20px;
      border: 3px solid #fde68a;
      box-shadow: 0 12px 40px rgba(249,202,36,0.12);
      backdrop-filter: blur(8px);
    }

    .lesson-container .main-char { font-size:4rem; }
    .lesson-container .example   { font-size:1.35rem; margin:10px 0; }
    .lesson-container .spelling  { font-size:1.1rem; margin:5px 0; color:#f472b6; font-weight:700; }

    .trace-area { display:flex; flex-direction:column; align-items:center; margin:10px 0; }

    .clear-btn {
      background: linear-gradient(160deg, #ff6b6b, #ee5a24);
      border: none; border-bottom: 4px solid #c0392b; border-right: 2px solid #c0392b;
      color: white; padding: 8px 20px; font-size: 0.95rem; border-radius: 999px;
      margin-top: 8px; cursor: pointer; font-family: 'Baloo 2', cursive; font-weight: 700;
      box-shadow: 0 4px 14px rgba(255,107,107,0.35);
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), border-bottom 0.1s;
    }
    .clear-btn:hover  { transform: translateY(-2px) scale(1.06); }
    .clear-btn:active { transform: translateY(3px); border-bottom-width:1px; border-right-width:1px; }

    .sub-card h3 { font-size:1.15rem; margin:5px 0; font-family:'Baloo 2',cursive; font-weight:800; color:#0ea5e9; }
    .sub-card p  { font-size:0.9rem; margin:0; line-height:1.3; color:#777; }

    .back-button-container { position:fixed; top:15px; left:15px; z-index:1000; }

    .sound-btn {
      background: linear-gradient(160deg, #f9ca24, #f0932b);
      border: none; border-bottom: 4px solid #c07800; border-right: 2px solid #c07800;
      color: white; padding: 9px 18px; border-radius: 999px; cursor: pointer; margin: 5px;
      font-size: 0.95rem; font-family: 'Baloo 2', cursive; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 14px rgba(249,202,36,0.4);
      transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), border-bottom 0.1s;
    }
    .sound-btn:hover  { transform: translateY(-2px) scale(1.06); }
    .sound-btn:active { transform: translateY(3px); border-bottom-width:1px; }

    #globalBack {
      position:fixed; top:15px; left:15px; z-index:1000; margin:0;
      background: linear-gradient(160deg, #43e97b, #38f9d7);
      border: none; border-bottom: 4px solid #1db863; border-right: 2px solid #1db863;
      color: white; padding: 10px 20px; border-radius: 999px;
      font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 5px 16px rgba(67,233,123,0.35);
      transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s;
    }
    #globalBack:hover  { transform: translateY(-3px) scale(1.07); box-shadow: 0 8px 22px rgba(67,233,123,0.45); }
    #globalBack:active { transform: translateY(3px); border-bottom-width:1px; }

    #globalLogout {
      position:fixed; top:15px; left:15px; z-index:1000; margin:0;
      background: linear-gradient(160deg, #ff6b6b, #ee5a24);
      border: none; border-bottom: 4px solid #c0392b; border-right: 2px solid #c0392b;
      color: white; padding: 10px 18px; border-radius: 999px;
      font-family: 'Baloo 2', cursive; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 5px 16px rgba(255,107,107,0.35);
      transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s;
      display:flex; align-items:center; gap:6px;
    }
    #globalLogout:hover  { transform: translateY(-3px) scale(1.07); box-shadow: 0 8px 22px rgba(255,107,107,0.45); }
    #globalLogout:active { transform: translateY(3px); border-bottom-width:1px; }
    #globalLogout i { font-size:1rem; }

    #chatbotBtn {
      position:fixed; top:14px; right:112px; z-index:1000;
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      border: none; border-bottom: 4px solid #1db863;
      color:white; width:46px; height:46px; border-radius:50%;
      cursor:pointer; box-shadow: 0 5px 18px rgba(67,233,123,0.45);
      display:flex; align-items:center; justify-content:center; font-size:1.25rem;
      transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
      animation: robotWiggle 5s ease-in-out infinite;
    }
    @keyframes robotWiggle {
      0%,85%,100% { transform:rotate(0deg) scale(1); }
      87%          { transform:rotate(-12deg) scale(1.1); }
      91%          { transform:rotate(12deg) scale(1.1); }
      95%          { transform:rotate(-6deg) scale(1.05); }
    }
    #chatbotBtn:hover  { transform:scale(1.18) rotate(0deg) !important; box-shadow:0 8px 26px rgba(67,233,123,0.55); animation:none; }
    #chatbotBtn:active { transform:scale(0.9) !important; border-bottom-width:1px; }

    #langIconBtn {
      position:fixed; top:14px; right:60px; z-index:1000;
      background:white; border:3px solid #43e97b; border-bottom:5px solid #1db863;
      color:#1db863; width:46px; height:46px; border-radius:50%; cursor:pointer;
      box-shadow:0 5px 16px rgba(67,233,123,0.3);
      display:flex; align-items:center; justify-content:center; font-size:1.25rem; font-weight:900;
      transition:transform 0.2s cubic-bezier(.34,1.56,.64,1), background 0.2s, color 0.2s;
    }
    #langIconBtn:hover  { transform:scale(1.18) rotate(10deg); background:#43e97b; color:white; }
    #langIconBtn:active { transform:scale(0.9); }

    #logoutBtn {
      position:fixed; top:14px; right:10px; z-index:1000;
      background:linear-gradient(135deg, #ff6b6b, #ee5a24);
      border:none; border-bottom:4px solid #c0392b;
      color:white; width:46px; height:46px; border-radius:50%; cursor:pointer;
      box-shadow:0 5px 16px rgba(255,107,107,0.35);
      display:flex; align-items:center; justify-content:center; font-size:1.2rem;
      transition:transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
    }
    #logoutBtn:hover  { transform:scale(1.18); box-shadow:0 8px 24px rgba(255,107,107,0.45); }
    #logoutBtn:active { transform:scale(0.9); }

    .modal-overlay {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(249,202,36,0.18); backdrop-filter:blur(10px);
      display:none; align-items:center; justify-content:center; z-index:2000;
    }

    .modal-box {
      background: linear-gradient(160deg, #fffef0 0%, #f0fffe 100%); max-width:380px; width:92%;
      padding:32px 26px; border-radius:36px; text-align:center;
      box-shadow: 0 0 0 5px #f472b6, 0 0 0 9px #f9ca24, 0 0 0 13px #43e97b, 0 25px 60px rgba(0,0,0,0.12);
      animation:modalBounceIn 0.45s cubic-bezier(.34,1.56,.64,1) both;
      position:relative;
    }
    @keyframes modalBounceIn {
      0%   { transform:scale(0.4) rotate(-8deg); opacity:0; }
      70%  { transform:scale(1.06) rotate(2deg); opacity:1; }
      100% { transform:scale(1)    rotate(0deg); opacity:1; }
    }

    .modal-close {
      position:absolute; top:14px; right:16px; font-size:1.5rem; cursor:pointer;
      color:#ccc; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
      border-radius:50%; transition:color 0.2s, transform 0.2s, background 0.2s;
    }
    .modal-close:hover { color:#ff6b6b; background:#ffeeee; transform:rotate(90deg) scale(1.15); }

    .chatbot-modal {
      position:fixed; bottom:20px; right:20px; width:385px;
      background:white; border-radius:28px;
      box-shadow: 0 0 0 4px #f9ca24, 0 20px 60px rgba(249,202,36,0.2);
      display:none; flex-direction:column; z-index:2000; overflow:hidden;
      animation:chatSlideUp 0.4s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes chatSlideUp {
      from { transform:translateY(60px) scale(0.9); opacity:0; }
      to   { transform:translateY(0)    scale(1);   opacity:1; }
    }
    @keyframes slideIn {
      from { transform:translateY(20px) scale(0.95); opacity:0; }
      to   { transform:translateY(0)    scale(1);    opacity:1; }
    }

    #chatbotContainer { padding:0; background:white; min-height:400px; }

    .linguakids-chatbot {
      width:100% !important; font-family:'Nunito',sans-serif !important;
      border:none !important; border-radius:18px !important; padding:0 !important;
      background:white !important; box-shadow:none !important; overflow:hidden;
    }

    .linguakids-chatbot-header {
      background:linear-gradient(135deg, #0ea5e9, #43e97b) !important;
      color:white !important; padding:16px 18px !important; font-weight:800 !important;
      font-size:1.2rem !important; font-family:'Baloo 2',cursive !important; letter-spacing:0.5px;
      display:flex !important; align-items:center !important; justify-content:space-between !important;
      border-bottom:2px solid rgba(255,255,255,0.25) !important;
    }
    .linguakids-chatbot-header i { margin-right:8px; color:#ffd93d; font-size:1.3rem; }

    .chatbot-close {
      cursor:pointer; font-size:1.3rem; width:32px; height:32px;
      display:flex; align-items:center; justify-content:center;
      border-radius:50%; transition:all 0.2s; background:rgba(255,255,255,0.2); color:white;
    }
    .chatbot-close:hover { background:rgba(255,255,255,0.35); transform:rotate(90deg); }

    .linguakids-chat-messages {
      height:280px !important; overflow-y:auto !important; background:#fdf4ff !important;
      padding:15px !important; border-bottom:1px solid #ffe0d0 !important;
      display:flex !important; flex-direction:column !important; gap:10px !important;
    }
    .linguakids-chat-messages::-webkit-scrollbar       { width:6px; }
    .linguakids-chat-messages::-webkit-scrollbar-track { background:#fff0e0; }
    .linguakids-chat-messages::-webkit-scrollbar-thumb { background:#0ea5e9; border-radius:10px; }

    .linguakids-message {
      margin:0 !important; padding:10px 14px !important; border-radius:18px !important;
      max-width:85% !important; word-wrap:break-word !important; font-size:0.95rem !important;
      line-height:1.4 !important; box-shadow:0 2px 6px rgba(0,0,0,0.06) !important;
      animation:messagePop 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes messagePop {
      from { opacity:0; transform:translateY(12px) scale(0.9); }
      to   { opacity:1; transform:translateY(0)    scale(1);   }
    }
    .linguakids-user-message { background:linear-gradient(135deg,#43e97b,#38f9d7) !important; color:white !important; align-self:flex-end !important; border-bottom-right-radius:4px !important; }

<script>
// ===== USER MANAGEMENT =====
// Get current username from URL parameters, sessionStorage, or default to 'guest'
function getCurrentUser() {
  // Check URL parameters first (for login redirects)
  const urlParams = new URLSearchParams(window.location.search);
  const urlUser = urlParams.get('user');
  if (urlUser) {
    sessionStorage.setItem('currentUser', urlUser);
    return urlUser;
  }
  
  // Then check sessionStorage
  const sessionUser = sessionStorage.getItem('currentUser');
  if (sessionUser) {
    return sessionUser;
  }
  
  // Default to 'guest' if no user is logged in
  return 'guest';
}

// Check if this is the user's first visit to Hindi page
function isFirstVisit() {
  const username = getCurrentUser();
  const visitKey = `linguaKids_${username}_hindiVisited`;
  const hasVisited = localStorage.getItem(visitKey);
  
  // Return true if this is first visit (no flag exists)
  return !hasVisited;
}

// Mark that user has completed their first visit (after language selection)
function markAsVisited() {
  const username = getCurrentUser();
  const visitKey = `linguaKids_${username}_hindiVisited`;
  localStorage.setItem(visitKey, 'true');
}

// Get user-specific storage key for language preference
function getUserLanguageKey() {
  const username = getCurrentUser();
  return `linguaKids_${username}_hindiInterfaceLang`;
}

// Get user profile from localStorage (set by study.html)
function getUserProfile() {
  try {
    const profileStr = localStorage.getItem('linguaKidsProfile');
    if (profileStr) {
      return JSON.parse(profileStr);
    }
  } catch (e) {
    return null;
  }
  return null;
}

// Check if user is in teacher mode
function isTeacherMode() {
  const userProfile = getUserProfile();
  return userProfile && userProfile.studyMode === 'teacher';
}

// Barahkhadi data - Generate combinations for each consonant
const BARAHKHADI_BY_CONSONANT = CONSONANTS.map(consonant => {
  const combinations = VOWELS.map(vowel => {
    let combinedChar, pronunciation;
    
    // Handle special cases for vowel combinations
    switch(vowel.english) {
      case "a": combinedChar = consonant.hindi; pronunciation = consonant.pronunciation; break;
      case "aa": combinedChar = consonant.hindi + "ा"; pronunciation = consonant.pronunciation + "aa"; break;
      case "i": combinedChar = consonant.hindi + "ि"; pronunciation = consonant.pronunciation + "i"; break;
      case "ee": combinedChar = consonant.hindi + "ी"; pronunciation = consonant.pronunciation + "ee"; break;
      case "u": combinedChar = consonant.hindi + "ु"; pronunciation = consonant.pronunciation + "u"; break;
      case "oo": combinedChar = consonant.hindi + "ू"; pronunciation = consonant.pronunciation + "oo"; break;
      case "e": combinedChar = consonant.hindi + "े"; pronunciation = consonant.pronunciation + "e"; break;
      case "ai": combinedChar = consonant.hindi + "ै"; pronunciation = consonant.pronunciation + "ai"; break;
      case "o": combinedChar = consonant.hindi + "ो"; pronunciation = consonant.pronunciation + "o"; break;
      case "au": combinedChar = consonant.hindi + "ौ"; pronunciation = consonant.pronunciation + "au"; break;
      case "am": combinedChar = consonant.hindi + "ं"; pronunciation = consonant.pronunciation + "am"; break;
      case "ah": combinedChar = consonant.hindi + "ः"; pronunciation = consonant.pronunciation + "ah"; break;
      default: combinedChar = consonant.hindi; pronunciation = consonant.pronunciation;
    }
    
    return {
      hindi: combinedChar,
      english: consonant.english + vowel.english,
      pronunciation: pronunciation,
      vowel: vowel.hindi,
      vowelEnglish: vowel.english
    };
  });
  
  return {
    consonant: consonant.hindi,
    consonantEnglish: consonant.english,
    combinations: combinations
  };
});

function speakText(text, lang = 'hi-IN') {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel(); // Cancel any previous speech
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = 0.8; 
    window.speechSynthesis.speak(utterance);
  } else {
    console.log("Speech synthesis not supported");
  }
}

// ===== CORE PROGRESS TRACKING SYSTEM (Local only) =====
function initHindiProgress() {
  const defaultProgress = {
    level1: { alphabets: { completed: 0, total: VOWELS_LENGTH + CONSONANTS_LENGTH }, numbers: { completed: 0, total: NUMBERS_1_TO_100_LENGTH } },
    level2: { fruits: { completed: 0, total: LEVEL2_CATEGORY_LENGTH }, vegetables: { completed: 0, total: LEVEL2_CATEGORY_LENGTH }, animals: { completed: 0, total: LEVEL2_CATEGORY_LENGTH }, birds: { completed: 0, total: LEVEL2_CATEGORY_LENGTH }, vehicles: { completed: 0, total: LEVEL2_CATEGORY_LENGTH }, colors: { completed: 0, total: LEVEL2_CATEGORY_LENGTH } },
    level3: { greetings: { completed: 0, total: LEVEL3_CATEGORY_LENGTH }, activities: { completed: 0, total: LEVEL3_CATEGORY_LENGTH }, questions: { completed: 0, total: LEVEL3_CATEGORY_LENGTH } },
    games: { 'fill-blanks': { completed: 0, total: GAMES_LENGTHS['fill-blanks'] }, 'match-words': { completed: 0, total: GAMES_LENGTHS['match-words'] }, 'count-apples': { completed: 0, total: GAMES_LENGTHS['count-apples'] } },
    achievements: { firstSteps: false, alphabetMaster: false, numberWhiz: false, wordExpert: false, sentenceBuilder: false, weekStreak: false, monthStreak: false },
    streak: { count: 0, lastDate: null },
    sessionDate: null
  };

  let progress;
  try {
      progress = JSON.parse(localStorage.getItem('linguaKidsHindiProgress'));
      if (!progress) {
          progress = defaultProgress;
          console.log("Created new Hindi progress data.");
      } else {
          progress = { ...defaultProgress, ...progress, 
              level1: { ...defaultProgress.level1, ...progress.level1 },
              level2: { ...defaultProgress.level2, ...progress.level2 },
              level3: { ...defaultProgress.level3, ...progress.level3 },
              games: { ...defaultProgress.games, ...progress.games }
          };
      }
  } catch (e) {
      console.error("Error parsing progress data. Resetting to default.", e);
      progress = defaultProgress;
  }
  
  localStorage.setItem('linguaKidsHindiProgress', JSON.stringify(progress));
  updateHindiStreak();
  return progress;
}

// Update progress locally only - NO TOAST NOTIFICATION
window.updateHindiProgress = function(level, category, increment = 1, itemIdentifier = null) {
  const progress = JSON.parse(localStorage.getItem('linguaKidsHindiProgress'));
  const today = new Date().toDateString();
  
  if (progress[level] && progress[level][category]) {
    const itemKey = itemIdentifier ? `${level}_${category}_${itemIdentifier}` : null;
    const sessionKey = itemKey ? `${itemKey}_${today}` : null;

    if (sessionKey && sessionStorage.getItem(sessionKey)) {
      console.log("Progress already tracked for this item today.");
      return false;
    }
    
    if (progress[level][category].completed < progress[level][category].total) { 
      progress[level][category].completed = Math.min(progress[level][category].completed + increment, progress[level][category].total);
    } else {
      return false; 
    }
    
    localStorage.setItem('linguaKidsHindiProgress', JSON.stringify(progress));
    
    if (sessionKey) { sessionStorage.setItem(sessionKey, 'true'); }

    updateHindiStreak(); 
    
    // NO TOAST NOTIFICATION SHOWN HERE
    
    return true;
  }
  return false;
};

function updateHindiStreak() {
  const progress = JSON.parse(localStorage.getItem('linguaKidsHindiProgress'));
  const today = new Date().toDateString();
  
  if (progress.sessionDate !== today) {
    let lastDate = progress.streak.lastDate ? new Date(progress.streak.lastDate) : null;
    const todayDate = new Date();
    
    if (lastDate) {
      const diffTime = todayDate.getTime() - lastDate.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays === 1) { progress.streak.count++; } 
      else if (diffDays > 1) { progress.streak.count = 1; }
    } else {
      progress.streak.count = 1; 
    }
    
    progress.streak.lastDate = today;
    progress.sessionDate = today;
    localStorage.setItem('linguaKidsHindiProgress', JSON.stringify(progress));
  }
}

// ===== CANVAS FUNCTIONS FOR TRACING =====
function initCanvas() {
    const canvas = document.getElementById("traceCanvas");
    const ctx = canvas.getContext("2d");
    ctx.lineWidth = 4; 
    ctx.lineCap = "round"; 
    ctx.strokeStyle = "#58cc02";
    let drawing = false;

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches ? e.touches[0] : e;
        return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    function startDrawing(e) { drawing = true; }
    function stopDrawing() { drawing = false; ctx.beginPath(); }
    function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const p = getPos(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
    }
    
    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("touchstart", startDrawing);
    canvas.addEventListener("touchend", stopDrawing);
    canvas.addEventListener("touchmove", draw);
}

function clearCanvas() {
  const canvas = document.getElementById("traceCanvas");
  if (canvas) {
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

function trackNumberProgress(index) {
    const identifier = `number_${index + 1}`;
    updateHindiProgress('level1', 'numbers', 1, identifier);
}

function openGameLevel(level) {
  window.location.href = `hingames.html?level=${level}`;
}

function goToLevel2(category){ 
  if (!interfaceLang) return;
  window.location.href = `hinlevel2.html?category=${category}&lang=${interfaceLang}`; 
}

function goToLevel3(category){ 
  if (!interfaceLang) return;
  window.location.href = `hinlevel3.html?category=${category}&lang=${interfaceLang}`; 
}

// Updated goBack function to handle all navigation
function goBack() {
  const isTeacher = isTeacherMode();
  
  switch(currentView) {
    case 'level1':
      if (isTeacher) {
        showTeacherLogoutConfirmation();
      } else {
        window.location.href = 'index.html';
      }
      break;
    case 'alphabets-menu':
    case 'barahkhadi-menu':
    case 'numbers-menu':
      loadLevel1();
      break;
    case 'barahkhadi-detail':
      loadBarahkhadiConsonants();
      break;
    case 'alphabet-lesson':
      loadAlphabetsMenu();
      break;
    case 'barahkhadi-lesson':
      loadBarahkhadiConsonants();
      break;
    case 'number-lesson':
      loadNumbersMenu();
      break;
    default:
      loadLevel1();
  }
}

// ===== MODAL & INIT =====
document.addEventListener('DOMContentLoaded', function() {
  const modal = document.getElementById('languageModal');
  const backBtn = document.getElementById('globalBack');
  const globalLogout = document.getElementById('globalLogout');
  const langIcon = document.getElementById('langIconBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const chatbotBtn = document.getElementById('chatbotBtn');
  
  const currentUser = getCurrentUser();
  const userProfile = getUserProfile();
  const storageKey = getUserLanguageKey();
  const savedLang = localStorage.getItem(storageKey);
  const firstVisit = isFirstVisit();

  document.getElementById("learning-content").innerHTML = '';

  if (userProfile && userProfile.studyMode === 'teacher' && userProfile.assignedLanguage) {
    if (firstVisit) {
      interfaceLang = null;
      modal.style.display = 'flex';
      if (backBtn) backBtn.style.display = 'none';
      if (globalLogout) globalLogout.style.display = 'none';
      if (langIcon) langIcon.style.display = 'none';
      if (logoutBtn) logoutBtn.style.display = 'none';
      if (chatbotBtn) chatbotBtn.style.display = 'none';
    } else if (savedLang) {
      interfaceLang = savedLang;
      modal.style.display = 'none';
      loadLevel1();
      if (backBtn) backBtn.style.display = 'none'; // Hide back button for teacher mode
      if (globalLogout) globalLogout.style.display = 'flex'; // Show global logout for teacher mode (only on main page)
      if (langIcon) langIcon.style.display = 'flex';
      if (logoutBtn) logoutBtn.style.display = 'none'; // Hide right logout for teacher mode
      if (chatbotBtn && interfaceLang) chatbotBtn.style.display = 'flex';
    } else {
      interfaceLang = null;
      modal.style.display = 'flex';
      if (backBtn) backBtn.style.display = 'none';
      if (globalLogout) globalLogout.style.display = 'none';
      if (langIcon) langIcon.style.display = 'none';
      if (logoutBtn) logoutBtn.style.display = 'none';
      if (chatbotBtn) chatbotBtn.style.display = 'none';
    }
  } else {
    if (firstVisit) {
      interfaceLang = null;
      modal.style.display = 'flex';
      if (backBtn) backBtn.style.display = 'none';
      if (globalLogout) globalLogout.style.display = 'none';
      if (langIcon) langIcon.style.display = 'none';
      if (logoutBtn) logoutBtn.style.display = 'none';
      if (chatbotBtn) chatbotBtn.style.display = 'none';
    } else if (savedLang) {
      interfaceLang = savedLang;
      modal.style.display = 'none';
      loadLevel1();
      if (backBtn) backBtn.style.display = 'inline-block'; // Show back button for self-study
      if (globalLogout) globalLogout.style.display = 'none'; // Hide global logout for self-study
      if (langIcon) langIcon.style.display = 'flex';
      if (logoutBtn && currentUser !== 'guest') logoutBtn.style.display = 'flex'; // Show right logout for self-study
      if (chatbotBtn && interfaceLang) chatbotBtn.style.display = 'flex';
    } else {
      interfaceLang = null;
      modal.style.display = 'flex';
      if (backBtn) backBtn.style.display = 'none';
      if (globalLogout) globalLogout.style.display = 'none';
      if (langIcon) langIcon.style.display = 'none';
      if (logoutBtn) logoutBtn.style.display = 'none';
      if (chatbotBtn) chatbotBtn.style.display = 'none';
    }
  }

  const englishOption = document.getElementById('chooseEnglish');
  const marathiOption = document.getElementById('chooseMarathi');
  
  const newEnglishOption = englishOption.cloneNode(true);
  const newMarathiOption = marathiOption.cloneNode(true);
  englishOption.parentNode.replaceChild(newEnglishOption, englishOption);
  marathiOption.parentNode.replaceChild(newMarathiOption, marathiOption);

  newEnglishOption.addEventListener('click', function() {
    interfaceLang = 'english';
    localStorage.setItem(getUserLanguageKey(), 'english');
    markAsVisited();
    modal.style.display = 'none';
    loadLevel1();
    const isTeacher = isTeacherMode();
    if (backBtn) backBtn.style.display = isTeacher ? 'none' : 'inline-block';
    if (globalLogout) globalLogout.style.display = isTeacher ? 'flex' : 'none';
    if (langIcon) langIcon.style.display = 'flex';
    if (logoutBtn && currentUser !== 'guest') logoutBtn.style.display = isTeacher ? 'none' : 'flex';
    if (chatbotBtn && interfaceLang) chatbotBtn.style.display = 'flex';
  });

  newMarathiOption.addEventListener('click', function() {
    interfaceLang = 'marathi';
    localStorage.setItem(getUserLanguageKey(), 'marathi');
    markAsVisited();
    modal.style.display = 'none';
    loadLevel1();
    const isTeacher = isTeacherMode();
    if (backBtn) backBtn.style.display = isTeacher ? 'none' : 'inline-block';
    if (globalLogout) globalLogout.style.display = isTeacher ? 'flex' : 'none';
    if (langIcon) langIcon.style.display = 'flex';
    if (logoutBtn && currentUser !== 'guest') logoutBtn.style.display = isTeacher ? 'none' : 'flex';
    if (chatbotBtn && interfaceLang) chatbotBtn.style.display = 'flex';
  });
});
